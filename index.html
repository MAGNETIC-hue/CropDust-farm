<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CropDust Farm</title>
<style>
body{margin:0;background:#172b1c;color:white;font-family:Arial,sans-serif;text-align:center}
#game{max-width:900px;margin:auto;padding:12px}
canvas{width:100%;max-width:900px;border:3px solid #111;border-radius:10px;background:#79b84b;image-rendering:auto}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px}
button{padding:9px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
#info{font-size:15px;margin:7px}
</style>
</head>
<body>
<div id="game">
<h1>🌾 CropDust Farm</h1>
<div id="info"></div>
<div id="bar">
<button onclick="switchVehicle()">Switch Vehicle</button>
</div>
<canvas id="c" width="900" height="560"></canvas>
<p>WASD / Arrow Keys = drive • P = plant • H = harvest • F = sell • R = reset</p>
</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d"), info=document.getElementById("info");
 let keys={}, money=500, seed=10, crop=0, tractor={x:150,y:455}, combine={x:220,y:455}, fields=[], shopCooldown=false, vehicle="tractor"
for(let r=0;r<3;r++)for(let q=0;q<5;q++)fields.push({x:360+q*95,y:130+r*105,state:0,age:0});
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()=="p")plant();if(e.key.toLowerCase()=="h")harvest();if(e.key.toLowerCase()=="s")sell();if(e.key.toLowerCase()=="r")location.reload()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function near(f){
 let v=vehicle==="tractor"?tractor:combine;
 return Math.hypot(v.x-f.x,v.y-f.y)<48
}
function plant(){
 if(vehicle!=="tractor")return;
 let f=fields.find(f=>near(f)&&f.state==0);
 if(f&&seed>0){f.state=1;f.age=0;seed--}
}
function harvest(){
 if(vehicle!=="combine")return;
 fields.forEach(f=>{if(near(f)&&f.state==3){f.state=0;f.age=0;crop+=2}})
}
function sell(){
 if(Math.hypot(tractor.x-115,tractor.y-105)<65&&crop){money+=crop*35;crop=0}
}function switchVehicle(){
 vehicle=vehicle==="tractor"?"combine":"tractor";
}
function openShop(){ 
 if(Math.hypot(tractor.x-117,tractor.y-100)<100 && !shopCooldown){
    shopCooldown=true;
    let choice=prompt("SHOP\n\n1 = Buy 10 seeds for $50\n2 = Buy 25 seeds for $100\n\nCancel = Leave");
    if(choice==="1" && money>=50){money-=50;seed+=10}
    if(choice==="2" && money>=100){money-=100;seed+=25}
    setTimeout(()=>{shopCooldown=false},10000);
  }
}
function update(){
 let sp=3;
 let v=vehicle==="tractor"?tractor:combine
 openShop();
if(keys.w||keys.arrowup)v.y-=sp;
if(keys.s||keys.arrowdown)v.y+=sp;
if(keys.a||keys.arrowleft)v.x-=sp;
if(keys.d||keys.arrowright)v.x+=sp;
 v.x=Math.max(25,Math.min(875,v.x));
v.y=Math.max(25,Math.min(535,v.y));
 fields.forEach(f=>{if(f.state==1||f.state==2){f.age+=.015;if(f.age>2)f.state=3}});
 draw();
 requestAnimationFrame(update);
}
function draw(){
 x.clearRect(0,0,900,560);
 // grass
 x.fillStyle="#78b94b";x.fillRect(0,0,900,560);
 // paths
 x.fillStyle="#d2b477";x.fillRect(0,275,900,55);x.fillRect(280,0,55,560);
 // house
 x.fillStyle="#b85c45";x.fillRect(55,55,125,90);x.fillStyle="#70402f";
 x.beginPath();x.moveTo(40,55);x.lineTo(117,15);x.lineTo(195,55);x.closePath();x.fill();
 x.fillStyle="#222";x.fillRect(105,90,30,55);x.fillStyle="white";x.font="bold 18px Arial";x.fillText("SHOP",85,175);
 // sell zone
 x.fillStyle="#e6c84f";x.fillRect(45,195,145,55);x.fillStyle="#222";x.fillText("SELL CROPS",67,228);
 // fields
 fields.forEach(f=>{
   x.fillStyle="#6d482d";x.fillRect(f.x-38,f.y-38,76,76);
   x.strokeStyle="#4b301f";x.strokeRect(f.x-38,f.y-38,76,76);
   if(f.state==1){x.fillStyle="#6fb63d";x.font="30px Arial";x.fillText("🌱",f.x-16,f.y+12)}
   if(f.state==2){x.fillStyle="#4d9634";x.font="34px Arial";x.fillText("🌿",f.x-18,f.y+13)}
   if(f.state==3){x.fillStyle="#e3bd38";x.font="35px Arial";x.fillText("🌾",f.x-18,f.y+13)}
});    
// combine
x.save();
x.translate(combine.x,combine.y);

// main body
x.fillStyle="#e8c21a";
x.fillRect(-30,-18,60,36);

// darker lower body
x.fillStyle="#b89412";
x.fillRect(-30,5,60,13);

// cab
x.fillStyle="#333";
x.fillRect(-2,-35,27,18);
x.fillStyle="#9ed4e8";
x.fillRect(2,-32,20,12);

// wheels
x.fillStyle="#181818";
x.beginPath();x.arc(-20,20,12,0,Math.PI*2);x.fill();
x.beginPath();x.arc(20,20,12,0,Math.PI*2);x.fill();

// wheel hubs
x.fillStyle="#777";
x.beginPath();x.arc(-20,20,5,0,Math.PI*2);x.fill();
x.beginPath();x.arc(20,20,5,0,Math.PI*2);x.fill();

// front header
x.fillStyle="#555";
x.fillRect(-43,-9,13,18);
x.fillStyle="#222";
x.fillRect(-47,-5,5,10);

// header teeth
for(let i=0;i<4;i++){
 x.fillRect(-48+i*4,9,2,7);
}

x.restore();
 // tractor
 x.save();x.translate(tractor.x,tractor.y);
 x.fillStyle="#d92";x.fillRect(-25,-15,50,30);x.fillStyle="#8b5a2b";x.fillRect(0,-28,25,18);
 x.fillStyle="#111";x.beginPath();x.arc(-17,20,11,0,7);x.fill();x.beginPath();x.arc(17,20,11,0,7);x.fill();
 x.restore();
 info.textContent=`💰 $${money}   🌱 Seeds: ${seed}   🌾 Harvest: ${crop} | Plant: $0 • Harvest: +2 • Sell: $35 each`;
}
update();
</script>
</body></html>
